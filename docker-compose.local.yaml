services:
  imc-nginx-service:
    container_name: imc-nginx-service
    image: nginx:stable-alpine
    depends_on:
      imc-master-service:
        condition: service_healthy
      imc-user-service:
        condition: service_healthy
      imc-content-service:
        condition: service_healthy
      imc-public-content-service:
        condition: service_healthy
      imc-file-service:
        condition: service_healthy
      imc-setting-service:
        condition: service_healthy
    ports:
      - '4076:1869'
    volumes:
      - './nginx/app.config.local:/etc/nginx/conf.d/default.conf'
    networks:
      - imc-network
    restart: unless-stopped

  imc-master-service:
    container_name: imc-master-service
    build:
      context: ./master-service
      dockerfile: Dockerfile.local
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    environment:
      XDEBUG_MODE: ${XDEBUG_MODE:-off}
    volumes:
      - ./master-service:/var/www/html
      - ./master-service/storage:/var/www/html/storage
      - ./master-service/docker/php/php.ini.local:/usr/local/etc/php/php.ini
      - ./master-service/docker/php/xdebug.ini.local:/usr/local/etc/php/conf.d/99-xdebug.ini
      - ./master-service/docker/scripts/start.sh.local:/var/www/html/docker/scripts/start.sh
    networks:
      - imc-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "php", "artisan", "--version"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  imc-user-service:
    container_name: imc-user-service
    build:
      context: ./user-service
      dockerfile: Dockerfile.local
    extra_hosts:
      - 'host.docker.internal:host-gateway'
