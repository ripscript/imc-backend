      - ./user-service/docker/scripts/start.sh.local:/var/www/html/docker/scripts/start.sh
    networks:
      - imc-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "php", "artisan", "--version"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

