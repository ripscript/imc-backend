version: "3"

services:
  imc-new-engine-nginx-service:
    container_name: imc-new-engine-nginx-service
    image: nginx:stable-alpine
    depends_on:
      - imc-new-engine-master-service
    ports:
      - '4121:1869'
    volumes:
      - './nginx/app.config.dev:/etc/nginx/conf.d/default.conf'
    networks:
      - imc-new-network
      - server_database-postgres-network

  imc-new-engine-master-service:
    container_name: imc-new-engine-master-service
    build: 
      context: ./master-service
      dockerfile: Dockerfile.dev
    volumes:
      - ./master-service:/var/www/html
      - ./master-service/storage:/var/www/html/storage
      - ./master-service/docker/php/php.ini:/etc/local/etc/php/php.ini
    networks:
      - imc-new-network
      - server_database-postgres-network

  imc-new-engine-user-service:
    container_name: imc-new-engine-user-service
    build: 
      context: ./user-service
      dockerfile: Dockerfile.dev
    volumes:
      - ./user-service:/var/www/html
      - ./user-service/storage:/var/www/html/storage
      - ./user-service/docker/php/php.ini:/etc/local/etc/php/php.ini
    networks:
      - imc-new-network
      - server_database-postgres-network

  imc-new-engine-migration-service:
    container_name: imc-new-engine-migration-service
    build: 
      context: ./migration-service
      dockerfile: Dockerfile.dev
    volumes:
      - ./migration-service:/var/www/html
      - ./migration-service/storage:/var/www/html/storage
      - ./migration-service/docker/php/php.ini:/etc/local/etc/php/php.ini
    networks:
      - imc-new-network
      - server_database-postgres-network
  
  imc-new-engine-file-service:
    container_name: imc-new-engine-file-service
    build: 
      context: ./file-service
      dockerfile: Dockerfile.dev
    volumes:
      - ./file-service:/var/www/html
      - ./file-service/storage:/var/www/html/storage
      - ./file-service/docker/php/php.ini:/etc/local/etc/php/php.ini
    networks:
      - imc-new-network
      - server_database-postgres-network

  imc-new-engine-content-service:
    container_name: imc-new-engine-content-service
    build: 
      context: ./content-service
      dockerfile: Dockerfile.dev
    volumes:
      - ./content-service:/var/www/html
      - ./content-service/storage:/var/www/html/storage
      - ./content-service/docker/php/php.ini:/etc/local/etc/php/php.ini
    networks:
      - imc-new-network
      - server_database-postgres-network

  imc-new-engine-public-content-service:
    container_name: imc-new-engine-public-content-service
    build: 
      context: ./public-content-service
      dockerfile: Dockerfile.dev
    volumes:
      - ./public-content-service:/var/www/html
      - ./public-content-service/storage:/var/www/html/storage
      - ./public-content-service/docker/php/php.ini:/etc/local/etc/php/php.ini
    networks:
      - imc-new-network
      - server_database-postgres-network

  imc-new-engine-setting-service:
    container_name: imc-new-engine-setting-service
    build: 
      context: ./setting-service
      dockerfile: Dockerfile.dev
    volumes:
      - ./setting-service:/var/www/html
      - ./setting-service/storage:/var/www/html/storage
      - ./setting-service/docker/php/php.ini:/etc/local/etc/php/php.ini
    networks:
      - imc-new-network
      - server_database-postgres-network

networks:
  server_database-postgres-network:
    name: server_database-postgres-network
    external: true

  imc-new-network:
    name: imc-new-network
    external: true